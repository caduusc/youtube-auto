# ---------------------------------------------------------------------------
# youtube-auto — configuracao
#
#   cp config.example.yaml config.yaml
#
# Nenhum valor abaixo esta hardcoded no codigo. Chaves de API NAO ficam aqui:
# o campo `env` diz de qual variavel de ambiente cada chave e lida.
# ---------------------------------------------------------------------------

# ===========================================================================
# ESTE E O CAMPO MAIS IMPORTANTE DO ARQUIVO.
#
# `style_suffix` e concatenado ao `concept` de cada segmento antes de ir para o
# provider de imagem. E o unico mecanismo que faz 20 imagens geradas em 20
# chamadas independentes parecerem sair da mao do mesmo ilustrador. Se voce
# mexer em um campo so, mexa neste — e depois de calibrar, NAO mexa mais, ou
# os videos antigos e novos vao parecer de canais diferentes.
#
# Uma boa regra: descreva medium, paleta, luz e tratamento de borda. Nao
# descreva conteudo (isso e papel do `concept`) e nunca peca texto na imagem.
# ===========================================================================
style_suffix: >-
  editorial illustration, flat vector shapes with subtle paper grain,
  muted palette of warm sand, deep teal and burnt orange on off-white,
  soft directional light from the upper left, generous negative space,
  thick confident outlines, no text, no lettering, no watermark,
  no logos, no human faces in focus

anthropic:
  # O planejamento editorial (estagio 3) e o que mais determina se o video
  # fica bom: onde cortar e o que a cena mostra.
  model: claude-opus-5
  env: ANTHROPIC_API_KEY
  effort: high          # low | medium | high | xhigh | max
  max_tokens: 16000
  timeout_seconds: 900  # Opus com thinking adaptativo pensa um bom tempo
  max_attempts: 3       # tentativas de EDL valida antes de desistir
  # Planejamento em duas fases. A fase 1 le a transcricao inteira e devolve o
  # briefing visual do video (assunto, argumento, vocabulario visual, clices a
  # evitar); a fase 2 monta a EDL escolhendo dentro daquele vocabulario.
  #
  # Existe porque as duas tarefas competiam na mesma resposta: pedir na mesma
  # chamada "segmente a timeline" e "invente as imagens" fazia a segunda
  # sofrer, e saiam cenas plausiveis para um video de criador genericamente,
  # nao para ESTE video.
  #
  # Custa uma chamada a mais por video, uns USD 0.05. `false` volta ao passe
  # unico.
  two_phase: true

# Regras editoriais. Alimentam tanto o system prompt do estagio 3 quanto o
# validador — as duas pontas leem daqui, entao nao podem divergir.
# ATENCAO: estas regras interagem de um jeito que nao e obvio.
#
# Com faixas de b-roll de L segundos e proporcao r, a taxa de trocas e
# `120 * r / L` — que NAO depende da duracao do video. Com os valores abaixo
# (L <= 25s, 3 trocas/min), a proporcao para de subir em `25*3/120 = 62.5%`:
# o teto de `broll_ratio_max` abaixo de 70% nunca e atingido. Ele so entra em
# jogo se voce subir `broll_max_seconds` ou `max_switches_per_minute`.
#
# Alem disso, video curto aperta muito o espaco: num video de 2 minutos so
# existe UMA configuracao valida (3 faixas de b-roll de ~23s). Abaixo de
# ~70s, as regras nao tem solucao nenhuma — o estagio 3 detecta isso e para
# antes de chamar a API, dizendo qual knob soltar.
#
# Para testar com video curto, o caminho e baixar `intro_aroll_seconds` para
# uns 8s e `broll_ratio_min` para uns 0.35.
editorial:
  broll_min_seconds: 8.0
  broll_max_seconds: 25.0
  max_switches_per_minute: 3
  intro_aroll_seconds: 20.0     # os primeiros N segundos sao sempre a-roll
  broll_ratio_min: 0.50
  broll_ratio_max: 0.70         # inalcancavel com os valores acima; ver nota
  concept_tags_min: 2
  concept_tags_max: 4

# Corte seco de trecho morto: pausa longa e hesitacao.
#
# A lista de `fillers` NAO e aplicada por texto puro. Em portugues "e" e a 3a
# pessoa de "ser" e "um" e artigo: cortar por token destruiria frases. Todo
# candidato precisa passar tambem pelo silencio ANTES do som e pela duracao.
#
# O silencio e medido so ANTES porque hesitacao tem ordem fonetica fixa: o
# falante para, o som preenche a parada, e a fala retoma sem intervalo. A
# pausa retorica que precisa ser protegida e o espelho disso — em "o problema
# e... que ninguem olha" o silencio esta DEPOIS do verbo — entao olhar so o
# lado de antes ja a preserva. Medido na saida do faster-whisper: o intervalo
# depois vem exatamente 0.00s em 19 de 20 candidatos, porque o modelo atribui
# spans contiguos; exigi-lo era uma regra que nunca disparava.
#
# O que separa hesitacao de palavra abrindo frase depois de uma pausa e a
# duracao, comparada com a mediana daquele mesmo token na SUA fala.
#
# Os cortes sao listados com o texto ao redor no `--dry-run` e em trim.json,
# para voce revisar antes de renderizar.
trim:
  enabled: true
  pause_min_seconds: 0.8        # 1.2 e conservador, 0.5 e agressivo
  filler_min_seconds: 0.40      # piso absoluto de duracao
  filler_silence_seconds: 0.25  # silencio ANTES do som
  filler_stretch_ratio: 2.0     # e tambem 2x a mediana daquele token na sua fala
  keep_margin_seconds: 0.12     # sobra em cada ponta, para a emenda nao soar rente
  min_keep_seconds: 0.35        # trecho menor que isso seria um estalo
  fillers: [e, eh, ehh, ah, ahn, ahm, a, hm, hmm, hum, uhm, um, mm, mmm, uh]

transcribe:
  model: small          # tiny | base | small | medium | large-v3
  device: cpu
  compute_type: int8    # int8 e ~4x mais rapido que float32 em CPU
  language: pt
  beam_size: 5
  vad_filter: true

bank:
  db_path: assets/bank.db
  images_dir: assets/images
  # Modelo de embedding local. 384 dimensoes, ~90MB de download.
  #
  # E ingles de proposito, apesar de o video ser em portugues: o banco so
  # embeda o campo `concept`, que o estagio 3 sempre escreve em ingles. O
  # transcript nunca passa por aqui. Um modelo multilingue seria 471MB para
  # nenhum ganho — e 471MB de download falha muito mais.
  #
  # Se voce quiser embedar texto em portugues por algum motivo, troque para
  # `sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2`. ATENCAO:
  # trocar de modelo invalida o banco existente. Os dois tem 384 dimensoes,
  # entao a comparacao nao falharia por tamanho — ela daria numeros sem
  # sentido. O banco guarda qual modelo gerou cada linha e so compara dentro
  # do mesmo, entao o que acontece de fato e que os assets antigos param de
  # ser reusados e o `bank stats` mostra as duas familias.
  #
  # Aceita tambem o caminho de uma pasta local, se a sua rede nao consegue
  # baixar do HuggingFace: baixe os arquivos do modelo por fora e aponte para
  # a pasta, por exemplo `models/all-MiniLM-L6-v2`. O caminho e resolvido
  # contra a raiz do projeto (onde esta o config), nao contra o diretorio de
  # onde voce chamou o comando.
  #
  # Pasta existente vence o ID do Hub com o mesmo nome. A identidade gravada
  # no banco continua sendo este valor do config, nao o caminho absoluto,
  # para o banco nao invalidar se voce mover o projeto.
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  # Similaridade de cosseno minima para reusar uma imagem do banco.
  # 0.82 e conservador. Abaixo de ~0.75 comeca a reusar imagem que nao
  # ilustra o trecho; acima de ~0.90 o reuso praticamente nao acontece e a
  # conta de geracao explode.
  similarity_threshold: 0.82

# Retries por tipo de chamada. A assimetria nao e cosmetica:
#
# Criar uma predicao no provider NAO e idempotente. Se ela roda no servidor e
# a resposta se perde no caminho, repetir gera uma segunda imagem e cobra duas
# vezes — por isso `api_attempts` fica nos 3 do spec.
#
# Baixar um arquivo por URL e idempotente e de graca, entao pode insistir
# muito mais. Numa conexao que corrompe TLS em transferencia sustentada, 3
# tentativas dao ~50% de chance de perder um run de 20 imagens; 6 derrubam
# isso para ~3%. Suba se a sua conexao for pior.
network:
  api_attempts: 3
  download_attempts: 6
  base_delay_seconds: 1.0

budget:
  # Teto por video. R$ 200/mes / 8 videos = R$ 25/video ~= USD 4.60.
  # O default e bem abaixo disso de proposito: se estourar, o estagio 4 para
  # e mostra o relatorio de estimativa em vez de gastar.
  max_usd_per_video: 1.50
  brl_per_usd: 5.40     # taxa fixa, usada apenas no relatorio

# Provider de imagem. `active` escolhe a implementacao; as demais ficam
# inertes. Trocar de provider e trocar esta linha.
#
# `active: none` desliga a geracao: o pipeline usa so o banco e o stock
# gratuito, e o que nenhum dos dois resolver recebe o fallback de cor solida.
# E a configuracao para rodar sem conta de geracao — custo zero de imagem, ao
# preco de nao poder ilustrar conceito especifico.
image_provider:
  active: replicate
  replicate:
    env: REPLICATE_API_TOKEN
    # flux-schnell: ~USD 0.003/imagem, 4 passos, otimo para ilustracao flat.
    # flux-dev:     ~USD 0.025/imagem, mais fiel a prompts longos.
    model: black-forest-labs/flux-schnell
    cost_usd_per_image: 0.003
    aspect_ratio: "16:9"
    output_format: png
    timeout_seconds: 120

stock:
  # Stock gratuito para cenas genericas — custo zero, evita queimar geracao
  # em "mao digitando em teclado" pela vigesima vez.
  provider: pexels
  env: PEXELS_API_KEY
  orientation: landscape
  min_width: 2400        # precisamos de folga para o Ken Burns em 1080p
  timeout_seconds: 30
  # Se QUALQUER tag de `concept_tags` casar com esta lista, o segmento e
  # roteado para o stock antes de considerar geracao. Compare em minusculas,
  # match por substring.
  generic_tags:
    - office
    - desk
    - city
    - street
    - skyline
    - hands typing
    - keyboard
    - laptop
    - computer
    - coffee
    - nature
    - forest
    - ocean
    - mountain
    - sky
    - clouds
    - meeting
    - handshake
    - crowd
    - traffic
    - sunset
    - window
    - books
    - notebook
    - money
    - chart

render:
  width: 1920
  height: 1080
  # 0 = herdar o fps do arquivo de entrada. O default de 30 reencoda uma
  # entrada de 60fps para 30 (o audio nao dessincroniza, a duracao nao muda),
  # o que para cabeca falante e o certo: metade do arquivo, metade do tempo de
  # render. Use 0 se voce grava em 60 e quer manter.
  fps: 30
  crf: 20
  preset: medium
  crossfade_seconds: 0.4
  # Cor do fallback de cor solida (segmento que ficou sem imagem).
  solid_fallback_color: "0x1B2A33"
  # Acima deste tamanho o filtergraph e quebrado em chunks por janela de
  # tempo e concatenado no final com o demuxer concat.
  max_filtergraph_chars: 3000

  ken_burns:
    # scale_crop: escala a imagem para 2x a resolucao de saida, anima o
    #   tamanho da janela com `scale:eval=frame` e a translacao com as
    #   expressoes x/y do `crop`, e so entao reduz para 1080p. O passo de
    #   1px acontece na tela 2x, entao vira meio pixel na saida — e por isso
    #   que nao treme. Este e o caminho default.
    # zoompan: o filtro nativo. Deixado como escape hatch caso a sua build de
    #   ffmpeg recuse a reconfiguracao de tamanho por frame do scale_crop.
    #   Treme mais em movimento lento.
    engine: scale_crop
    zoom_min: 1.00
    zoom_max: 1.12
    # A direcao alterna nesta ordem entre segmentos consecutivos de b-roll,
    # para o movimento nao ficar repetitivo.
    directions: [zoom_in, pan_right, zoom_out, pan_left]
    # Fator de super-amostragem da tela intermediaria (2 = 2x a saida).
    canvas_scale: 2

subtitles:
  # Desligada: o video final nao leva legenda queimada. Ponha `true` se
  # quiser, que o resto do estilo abaixo ja esta calibrado.
  enabled: false
  font_name: Inter
  font_size: 54
  primary_color: "&H00FFFFFF"    # ASS usa &HAABBGGRR
  outline_color: "&H00101010"
  outline: 3
  shadow: 1
  bold: true
  alignment: 2                   # numpad: 2 = centro embaixo
  margin_v: 90
  max_chars_per_line: 42
  max_lines: 2
