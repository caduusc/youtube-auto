[project]
name = "youtube-auto"
version = "0.1.0"
description = "Pipeline de producao de video com b-roll gerado por IA"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "faster-whisper>=1.0",
    "sentence-transformers>=3.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
