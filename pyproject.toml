[project]
name = "youtube-auto"
version = "0.1.0"
description = "Pipeline de producao de video com b-roll gerado por IA"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "faster-whisper>=1.0",
    "sentence-transformers>=3.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "requests>=2.31",
    # A UI de revisao e aprovacao (`pipeline ui`). Dependencia normal e nao
    # extra opcional de proposito: sao dois portoes que existem para uma
    # PESSOA olhar antes de gastar dinheiro, entao a interface deles faz parte
    # da ferramenta. Tudo puro Python, nada compilado.
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
